<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NETA</title>
    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <header>
        <img src="logo.png" alt="" onerror="this.style.display='none'">
        <h1>NETA</h1>
    </header>
    <p class="sub">Загрузи фото мусора, и мы подскажем, куда его сдать.</p>

    <label class="file">📷 Выбрать фото
        <input id="file" type="file" accept="image/*">
    </label>
    <img id="preview" hidden alt="">
    <div id="status"></div>

    <div id="form" hidden>
        <div class="box">
            <b>Всё верно? Отметьте материалы и количество:</b>
            <div id="materials"></div>
        </div>
        <div class="box">
            <b>Ваш город или адрес</b>
            <input id="city" type="text" value="Караганда">
        </div>
        <button id="go">Куда сдать?</button>
    </div>

    <div id="results"></div>
</main>

<script src="points.js"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.1/dist/ort.min.js"></script>
<script src="app.js"></script>
</body>
</html>
